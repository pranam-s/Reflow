[project]
name = "reflow"
version = "0.1.0"
description = "Agent that clusters failed Razorpay payments into root causes and executes bounded recovery actions"
readme = "README.md"
authors = [
    { name = "Pranam Srivastava", email = "pranamsrivastava28@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "PT", "D", "ANN", "S", "ERA", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S311", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.coverage.run]
branch = true
source = ["src/reflow"]

[tool.coverage.report]
fail_under = 90
show_missing = true
